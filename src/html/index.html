<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./css/main.css" />
    <title>Arch | Home</title>
  </head>
  <body>
    <!-- @@include('./components/hero-section-bullets/hero.html') -->
    @@include("./header.html")

    <section class="hero container">
      <picture class="hero__image">
        <source
          srcset="./img/home/desktop/image-hero-paramour.webp"
          media="(min-width: 75em)"
          type="image/webp"
        />
        <source
          srcset="./img/home/tablet/image-hero-paramour.webp"
          media="(min-width: 48em)"
          type="image/webp"
        />
        <img src="./img/home/mobile/image-hero-paramour.webp" alt="" />
      </picture>
      <div class="hero__content">
        <h3 class="hero__title"></h3>
        <p class="hero__description"></p>
        <a href="#" class="hero__link button button__primary"
          >See Our Portfolio
          <span
            ><svg class="icon">
              <use
                href="./img/svgsprite/sprite.symbol.svg#icon-arrow"
              ></use></svg
          ></span>
        </a>
      </div>

      <div class="hero__buttons">
        <button type="button" class="hero__button button button__page">
          01
        </button>
        <button type="button" class="hero__button button button__page">
          02
        </button>
        <button type="button" class="hero__button button button__page">
          03
        </button>
        <button type="button" class="hero__button button button__page">
          04
        </button>
      </div>
    </section>

    <script src="./js/index.bundle.js"></script>
    <script src="./js/navigation.bundle.js"></script>
  </body>
</html>
