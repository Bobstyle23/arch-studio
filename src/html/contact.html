<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arch | Contact</title>
    <link href="./css/main.css" rel="stylesheet" />
  </head>
  <body>
    @@include("./header.html")
    <main class="contact container">
      <section class="hero-section">
        <picture class="hero-section__img">
          <source
            srcset="./img/contact/desktop/image-hero.webp"
            type="image/webp"
            media="(min-width: 64em)"
          />
          <source
            srcset="./img/contact/tablet/image-hero.webp"
            type="image/webp"
            media="(min-width: 48em)"
          />

          <img src="./img/contact/mobile/image-hero.webp" alt="" />
        </picture>
        <div class="hero-section__info" data-label="Contact">
          <div>
            <h3 class="hero-section__title">Tell us about<br />your project</h3>
            <p class="hero-section__desc">
              We’d love to hear more about your project. Please, leave a message
              below or give us a call. We have two offices, one in Texas and one
              in Tennessee. If you find yourself nearby, come say hello!
            </p>
          </div>
        </div>
      </section>
    </main>
    @@include("./footer.html")
    <script src="./js/utils.bundle.js"></script>
    <script src="./js/navigation.bundle.js"></script>
  </body>
</html>
