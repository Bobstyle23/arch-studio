<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./css/main.css" />
    <title>Arch | Home</title>
  </head>
  <body>

    <header class="header container">
  <div class="decor__header" aria-hidden="true">
    <div class="decor__header--line"></div>
    <p class="decor__header--page">HOME</p>
  </div>

  <a href="/" aria-label="Arch Studio Home">
    <svg class="logo" aria-hidden="true">
      <use href="./img/svgsprite/sprite.symbol.svg#logo"></use>
    </svg>
  </a>
  <nav class="navigation" aria-label="Main Navigation" id="Main navigation">
    <ul role="list" class="navigation__list">
      <li class="navigation__item">
        <a href="#">Portfolio</a>
      </li>
      <li class="navigation__item">
        <a href="#">About Us</a>
      </li>
      <li class="navigation__item">
        <a href="#">Contact</a>
      </li>
    </ul>
  </nav>
  <button class="menu__btn" aria-label="Open Navigation Menu">
    <svg
      class="menu__icon"
      aria-hidden="true"
      aria-expanded="false"
      aria-controls="Main navigation"
    >
      <use href="./img/svgsprite/sprite.symbol.svg#icon-hamburger"></use>
    </svg>
  </button>
</header>

    <section class="hero container">
      <picture class="hero__image">
        <source
          srcset="./img/home/desktop/image-hero-paramour.webp"
          media="(min-width: 75em)"
          type="image/webp"
        />
        <source
          srcset="./img/home/tablet/image-hero-paramour.webp"
          media="(min-width: 48em)"
          type="image/webp"
        />
        <img src="./img/home/mobile/image-hero-paramour.webp" alt="" />
      </picture>
      <div class="hero__content">
        <h3 class="hero__title">Project Paramour</h3>
        <p class="hero__description">
          Project made for an&#160;art museum near Southwest London. Project Paramour
          is&#160;a&#160;statement of&#160;bold, modern architecture.
        </p>
        <a href="#" class="hero__link button button__primary"
          >See Our Portfolio
          <span
            ><svg class="icon">
              <use
                href="./img/svgsprite/sprite.symbol.svg#icon-arrow"
              ></use></svg
          ></span>
        </a>
      </div>
    </section>

    <script src="./js/index.bundle.js"></script>
    <script src="./js/navigation.bundle.js"></script>
  </body>
</html>
